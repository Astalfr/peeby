[package]
name = "twitch"
description = "Client for Twitch: GQL playback tokens, usher playlists, ad filtering, Helix and chat (ADR 0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The chat's WebSocket stream and sink (docs/twitch-plan.md, step 9), agreed with the user on 2026-11-01.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset"] }
serde_json = "1"
thiserror = "2"
# `net` for the local playlist proxy (step 3), `time` for the chat's reconnection delay (step 9), agreed with the user.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The chat (step 9), agreed with the user on 2026-11-01.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
tracing = "0.1"
chrono = "0.4.45"
rand = "0.10.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
