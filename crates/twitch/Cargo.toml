[package]
name = "twitch"
description = "Client for Twitch: GQL playback tokens, usher playlists, ad filtering, Helix and chat (ADR 0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset"] }
serde_json = "1"
thiserror = "2"
# The local playlist proxy (docs/twitch-plan.md, step 3): `net` agreed with the user on 2026-11-01.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
