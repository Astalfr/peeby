[package]
name = "jellyfin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query"] }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
