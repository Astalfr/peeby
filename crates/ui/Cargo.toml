[package]
name = "ui"
description = "Peeby's shared UI: theme, motion, icons, images and components. Knows no service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel = "2"
blurhash = "0.2"
dirs = "6"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "=0.8.1"
gpui-video = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
player = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"

[dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }

[lints]
workspace = true
