[package]
name = "peeby"
description = "Native media client for Windows (YouTube, Jellyfin, Twitch) built with GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only `main`: the shell and each space are crates of their own, so that an edit rebuilds the
# crate it is in rather than the whole app (ADR 0029).
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "=0.8.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
innertube = { workspace = true }
peeby-core = { workspace = true }
space-jellyfin = { workspace = true }
space-twitch = { workspace = true }
space-youtube = { workspace = true }
tracing = "0.1"
twitch = { workspace = true }
ui = { workspace = true }

# The Twitch fixtures' capture (examples/twitch_capture.rs).
[dev-dependencies]
keyring = "4"
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
