[package]
name = "peeby"
description = "Native media client for Windows (YouTube, Jellyfin, Twitch) built with GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
dirs = "6"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "=0.8.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
innertube = { workspace = true }
jellyfin-api = { workspace = true }
keyring = "4"
player = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twitch = { workspace = true }
ui = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
