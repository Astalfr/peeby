[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
player = { path = "crates/player" }
gpui-video = { path = "crates/gpui-video" }
innertube = { path = "crates/innertube" }
jellyfin-api = { path = "crates/jellyfin-api" }
peeby-core = { path = "crates/peeby-core" }
space-jellyfin = { path = "crates/space-jellyfin" }
space-twitch = { path = "crates/space-twitch" }
space-youtube = { path = "crates/space-youtube" }
twitch = { path = "crates/twitch" }
ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Line tables only (backtraces, breakpoints by line; no local variables in a debugger): full
# debug info cost about a third of every rebuild of our crates and made a 500 MB PDB.
[profile.dev]
debug = "line-tables-only"

# GPUI is far too slow to render unoptimized; our own crates stay at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

# Copied from peeby: patched GPUI Windows platform with external D3D11 textures (see vendor/README.md).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
